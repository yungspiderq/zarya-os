name: Validate Zarya OS 2.1 professional workshop and anti-cheat

on:
  pull_request:
    paths:
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/check-hardware.yml'
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'tests/**'
      - '.github/workflows/check-hardware.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js; do node --check "$file"; done
      - name: Run virtual PC tests
        run: node tests/hardware.test.cjs
      - name: Verify component shop scrollbar
        run: node tests/shop-scroll.test.cjs
      - name: Test service desk and benchmark
        run: node tests/service-center.test.cjs
      - name: Test PC build orders
        run: node tests/pc-orders.test.cjs
      - name: Test cooling mechanics and saves
        run: node tests/cooling.test.cjs
      - name: Test used marketplace and item resale
        run: node tests/marketplace.test.cjs
      - name: Test company career economy and progression
        run: node tests/company.test.cjs
      - name: Test save backup and restore
        run: node tests/save-center.test.cjs
      - name: Test professional diagnostics, economics and QA
        run: node tests/pro-workshop.test.cjs
      - name: Test profile reset and anti-cheat
        run: node tests/integrity.test.cjs
      - name: Check page integrations
        run: |
          node -e 'const fs=require("fs"); const x=fs.readFileSync("index.html","utf8"); for(const f of ["js/hardware.js","js/arcade.js","js/components.js","js/drive-lab.js","js/main.js","css/components.css","css/drive-lab.css","js/service-center.js","css/service-center.css","js/pc-orders.js","css/pc-orders.css","js/cooling.js","css/cooling.css","js/marketplace.js","css/marketplace.css","js/company.js","js/company-app.js","css/company.css","js/save-center.js","css/save-center.css","js/season-reset.js","js/pro-workshop.js","js/pro-workshop-app.js","css/pro-workshop.css"])if(!x.includes(f+"?v=2.1.0"))throw Error("Missing cache-safe asset: "+f)'

  browser-smoke:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser smoke dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install chromium
      - name: Run full UI smoke in Chromium
        run: python tests/browser-smoke.py
      - name: Keep browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zarya-2.1-ui-screenshots
          path: screenshots-2.0/
          if-no-files-found: ignore
