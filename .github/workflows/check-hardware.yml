name: Check Zarya OS 1.8 hardware, cooling and services

on:
  pull_request:
    paths:
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/check-hardware.yml'
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'tests/**'
      - '.github/workflows/check-hardware.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js; do node --check "$file"; done
      - name: Run virtual PC tests
        run: node tests/hardware.test.cjs
      - name: Verify component shop scrollbar
        run: node tests/shop-scroll.test.cjs
      - name: Test service desk and benchmark
        run: node tests/service-center.test.cjs
      - name: Test PC build orders
        run: node tests/pc-orders.test.cjs
      - name: Test cooling mechanics and saves
        run: node tests/cooling.test.cjs
      - name: Check page integrations
        run: |
          node -e 'const fs=require("fs"); const x=fs.readFileSync("index.html","utf8"); for(const f of ["js/hardware.js","js/arcade.js","js/components.js","js/drive-lab.js","js/main.js","css/components.css","css/drive-lab.css","js/service-center.js","css/service-center.css","js/pc-orders.js","css/pc-orders.css","js/cooling.js","css/cooling.css"])if(!x.includes(f+"?v=1.8.0"))throw Error("Missing cache-safe asset: "+f)'
