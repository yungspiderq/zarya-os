name: Publish Zarya OS 2.2.1 Security Overhaul

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-2.2.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'yungspiderq/zarya-os'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package offline game and optional Node verified server
        run: zip -q -r zarya-os-2.2.1.zip index.html css js docs server README.md CHANGELOG.md RELEASE_NOTES_2.2.1.md LICENSE start.cmd start-verified.cmd
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.2.1 >/dev/null 2>&1; then
            echo 'Release v2.2.1 already exists'
            exit 0
          fi
          gh release create v2.2.1 zarya-os-2.2.1.zip \
            --target "${GITHUB_SHA}" \
            --title 'ЗАРЯ OS 2.2.1 «Security Overhaul»' \
            --notes-file RELEASE_NOTES_2.2.1.md \
            --latest
