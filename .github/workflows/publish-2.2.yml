name: Publish Zarya OS 2.2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-2.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'yungspiderq/zarya-os'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package offline application
        run: zip -q -r zarya-os-2.2.0.zip index.html css js docs README.md CHANGELOG.md RELEASE_NOTES_2.2.md LICENSE start.cmd
      - name: Publish public stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.2.0 >/dev/null 2>&1; then
            echo 'Release exists'
            exit 0
          fi
          gh release create v2.2.0 zarya-os-2.2.0.zip \
            --target "${GITHUB_SHA}" \
            --title 'ЗАРЯ OS 2.2 «Операции и цифровые следы»' \
            --notes-file RELEASE_NOTES_2.2.md \
            --latest
