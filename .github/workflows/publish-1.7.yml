name: Publish Zarya OS 1.7.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'yungspiderq/zarya-os'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package standalone version
        run: zip -q -r zarya-os-1.7.0.zip index.html css js docs README.md CHANGELOG.md RELEASE_NOTES_1.7.md LICENSE start.cmd
      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.7.0 >/dev/null 2>&1; then
            echo 'Release v1.7.0 already exists.'
            exit 0
          fi
          gh release create v1.7.0 zarya-os-1.7.0.zip \
            --target "${GITHUB_SHA}" \
            --title 'ЗАРЯ OS 1.7 «Сборка на заказ»' \
            --notes-file RELEASE_NOTES_1.7.md \
            --latest
