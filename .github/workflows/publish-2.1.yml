name: Publish Zarya OS 2.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-2.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'yungspiderq/zarya-os'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package offline game with anti-cheat and migration
        run: zip -q -r zarya-os-2.1.0.zip index.html css js docs README.md CHANGELOG.md RELEASE_NOTES_2.1.md LICENSE start.cmd
      - name: Publish stable Zarya OS 2.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.1.0 >/dev/null 2>&1; then
            echo 'Release already exists'
            exit 0
          fi
          gh release create v2.1.0 zarya-os-2.1.0.zip \
            --target "${GITHUB_SHA}" \
            --title 'ЗАРЯ OS 2.1 «Профессиональная мастерская»' \
            --notes-file RELEASE_NOTES_2.1.md \
            --latest
