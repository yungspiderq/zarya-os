name: Publish Zarya OS 1.5.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.5.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'yungspiderq/zarya-os'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package Zarya OS
        run: zip -q -r zarya-os-1.5.1.zip index.html css js docs README.md CHANGELOG.md RELEASE_NOTES_1.5.1.md LICENSE start.cmd
      - name: Publish patch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.5.1 >/dev/null 2>&1; then
            echo 'v1.5.1 is already published'
            exit 0
          fi
          gh release create v1.5.1 zarya-os-1.5.1.zip \
            --target "${GITHUB_SHA}" \
            --title 'ЗАРЯ OS 1.5.1 — исправление магазина' \
            --notes-file RELEASE_NOTES_1.5.1.md \
            --latest
