name: Publish Zarya OS 2.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-2.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'yungspiderq/zarya-os'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package self-contained offline game
        run: zip -q -r zarya-os-2.0.0.zip index.html css js docs README.md CHANGELOG.md RELEASE_NOTES_2.0.md LICENSE start.cmd
      - name: Publish Zarya OS 2.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0 >/dev/null 2>&1; then
            echo 'Release v2.0.0 already exists'
            exit 0
          fi
          gh release create v2.0.0 zarya-os-2.0.0.zip \
            --target "${GITHUB_SHA}" \
            --title 'ЗАРЯ OS 2.0 «Своя компьютерная мастерская»' \
            --notes-file RELEASE_NOTES_2.0.md \
            --latest
